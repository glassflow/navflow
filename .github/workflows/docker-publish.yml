# Build the Tares image in CI and publish it to GHCR, so servers pull a prebuilt image
# instead of building on the box.
#
# The image name is PINNED to <owner>/tares rather than derived from ${{ github.repository }}:
# the repo is still called navflow, and the image should carry the product name, not the
# repository's. It also means a later repo rename does not silently change the image name.
name: Publish image

on:
  push:
    tags: ["v*"]        # publish the image only on a release tag, not on every push
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3   # arm64 emulation for the multi-arch build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tares
          tags: |
            type=semver,pattern={{version}}            # v0.0.2 -> 0.0.2 (the pinnable tag)
            type=semver,pattern={{major}}.{{minor}}    #        -> 0.0
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The demo api-server (demo/api-server) — published so demo/docker-compose.yml runs anywhere
  # without a checkout. Multi-arch because the demo runs on laptops (Apple Silicon) as well as
  # amd64. `latest` is tagged unconditionally: this job only runs on release tags or manual
  # dispatch, both deliberate publishes, and the demo compose pins nothing else.
  publish-demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tares-demo-api-server
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: demo/api-server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=demo
          cache-to: type=gha,mode=max,scope=demo
