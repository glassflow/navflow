# Build the NavFlow image in CI and publish it to GHCR, so servers pull a prebuilt image
# (the compose files reference ghcr.io/<owner>/navflow) instead of building on the box.
name: Publish image

on:
  push:
    tags: ["v*"]        # publish the image only on a release tag, not on every push
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}   # ghcr.io/<owner>/navflow
          tags: |
            type=semver,pattern={{version}}            # v0.0.2 -> 0.0.2 (the pinnable tag)
            type=semver,pattern={{major}}.{{minor}}    #        -> 0.0
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
