# Test the backend + console on every push / PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          mkdir -p ui/dist        # satisfy the console force-include; the tests don't need the UI
          pip install -e .
      - name: Tests
        run: |
          for t in test_labels test_normalize test_readonly test_auth test_catalog_sync test_cli test_mcp_setup; do
            echo "== $t =="
            python "tests/$t.py"
          done

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ui
      - name: Typecheck + build
        run: |
          npx tsc --noEmit
          npm run build
        working-directory: ui

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks binary via its Docker image — no license needed (the gitleaks-action requires a
      # paid license for organization repos; the tool itself is free).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact
