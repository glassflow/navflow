# Tares demo stack — the *upstream* services Tares ingests from (the thing being monitored).
# Tares itself is NOT in here: install it separately (see demo/README.md), then point it at
# this stack via catalog.demo.yaml.
#
# Self-contained — runs anywhere, no repo checkout needed (Docker Compose v2.23.1+ for the
# inline prometheus config):
#   curl -O https://raw.githubusercontent.com/glassflow/navflow/main/demo/docker-compose.yml
#   docker compose up -d              # start the stack
#   docker compose down               # stop it
#
# Hacking on the api-server from a checkout? Build it from source instead of pulling:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
name: tares-demo

services:
  # The monitored app: Prometheus metrics on /metrics, request logs, and /demo/inject to
  # cause an incident. The fixed container_name is what Tares's docker_logs source tails
  # (catalog.demo.yaml), from any directory.
  api-server:
    image: ghcr.io/glassflow/tares-demo-api-server:latest
    container_name: tares-demo-api-server
    ports:
      - "8080:8080"

  # Scrapes api-server:8080/metrics every 5s. Tares reads PromQL from here on :9090.
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
        mode: 0444    # prometheus runs as nobody; the default config mode isn't world-readable
      - source: prometheus_rules
        target: /etc/prometheus/rules.yml
        mode: 0444
    depends_on:
      - api-server

  # Steady traffic so the metrics and logs are alive to look at. Uses the multi-arch python image
  # (same base as api-server) with a stdlib loop — no third-party image, runs natively on
  # linux/amd64 and linux/arm64 (Apple Silicon) alike.
  traffic-generator:
    image: python:3.12-slim
    depends_on:
      - api-server
    command:
      - python
      - "-u"
      - "-c"
      - |
        import time, urllib.request
        while True:
            for p in ("orders", "stats", "users"):
                try:
                    urllib.request.urlopen("http://api-server:8080/api/" + p, timeout=5).read()
                except Exception:
                    pass
            time.sleep(1)

configs:
  # Inline so this one file is the whole stack — nothing to mount from a checkout.
  prometheus_config:
    content: |
      global:
        scrape_interval: 5s
        evaluation_interval: 5s   # evaluate the alerting rules as fast as we scrape (snappy demo)

      rule_files:
        - /etc/prometheus/rules.yml

      scrape_configs:
        - job_name: api-server
          static_configs:
            - targets: ["api-server:8080"]

  # Alerting rules — Prometheus evaluates these itself and exposes firing alerts on /api/v1/alerts,
  # which Tares's `prometheus_alerts` source polls. No Alertmanager needed. Short `for:` so an
  # injected fault fires within ~15s. Each maps 1:1 to a `./inject.sh` scenario.
  prometheus_rules:
    content: |
      groups:
        - name: api-server
          rules:
            - alert: HighErrorRate
              expr: 100 * sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) > 5
              for: 15s
              labels: { severity: critical, service: api-server }
              annotations: { summary: "5xx error rate high on api-server" }
            - alert: HighLatency
              expr: histogram_quantile(0.99, sum(rate(http_request_duration_milliseconds_bucket[2m])) by (le)) > 1000
              for: 15s
              labels: { severity: warning, service: api-server }
              annotations: { summary: "p99 latency over 1s on api-server" }
            - alert: DependencyDown
              expr: dependency_up == 0
              for: 15s
              labels: { severity: critical, service: api-server }
              annotations: { summary: "a dependency is down for api-server" }
