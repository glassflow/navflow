# gitleaks config for the secrets CI job. Extends the stock ruleset — this file only carves out
# false positives, it never loosens detection of a real credential.
[extend]
useDefault = true

[allowlist]
description = "Tares config env var NAMES that the generic-api-key heuristic mistakes for secrets"
# generic-api-key fires on `NAME="value"` when NAME sits near a keyword like AUTH. These are
# non-secret sizing/behaviour knobs, matched by name only — anything holding an actual credential
# (TARES_AUTH_TOKEN, TARES_ANTHROPIC_KEY, ...) is deliberately absent, so a real leak still fails CI.
regexes = [
  '''TARES_MAX_DB_SIZE=''',
  '''TARES_TRIGGER_DEBOUNCE_SECONDS=''',
]
