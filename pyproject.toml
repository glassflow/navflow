[project]
name = "navflow"
version = "0.1.34"
description = "A self-hostable data plane for AI agents: ingest events, store them losslessly, and serve one correlated read of any entity over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GlassFlow" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "pydantic>=2",
    "mcp>=1.2",
    "pytz>=2024.1",   # DuckDB needs it to bind tz-aware datetimes to TIMESTAMPTZ
    "asyncpg>=0.29",  # Postgres connector driver — base so the connector works on `navflow up`
    "anthropic>=0.40",  # console Ask/Organize agent — base so it works on `navflow up`
]

[project.urls]
Homepage = "https://navflow.ai"
Documentation = "https://www.navflow.ai/docs"
Repository = "https://github.com/glassflow/navflow"

[project.optional-dependencies]
# OTLP gRPC receiver (:4317). The OTLP/HTTP JSON receiver needs none of this; grpcio is a heavy
# compiled dep, so the gRPC path stays opt-in. (postgres/agent deps are now base — `navflow up`
# ships a working Postgres connector and Ask agent with no extras.)
otlp-grpc = ["grpcio>=1.60", "opentelemetry-proto>=1.20"]

[project.scripts]
navflow = "navflow.cli:main"
navflowd = "navflow.cli:run_daemon"
navflow-mcp = "navflow.cli:run_mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The console is a build artifact (ui/dist is gitignored) — include it in the sdist too, so the
# wheel can be rebuilt from the sdist (uv build → sdist → wheel).
[tool.hatch.build]
artifacts = ["ui/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["navflow"]

# Ship the built console SPA inside the package (navflow/console), so `pip install` serves the UI.
# Build the UI first: `cd ui && npm install && npm run build` emits ui/dist before the wheel build.
[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "navflow/console"
