# Build the image locally instead of pulling it (dev, or when you don't use CI). LAYER this over a
# base compose and run `build`; it inherits that file's image tag, so a plain `up` then uses it:
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.build.yml build
#   docker compose -f deploy/compose/docker-compose.yml up -d
# (Layer over docker-compose.selfhost.yml to build the pinned self-host tag instead of :latest.)
services:
  taresd:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
