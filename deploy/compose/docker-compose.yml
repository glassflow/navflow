# NavFlow public demo — read-only, one hostname (Caddy) fronting the daemon + remote MCP.
# Pulls the prebuilt image (NAVFLOW_REGISTRY / NAVFLOW_VERSION override it; build locally with the
# docker-compose.build.yml override). The demo tracks :latest.
#   docker compose -f deploy/compose/docker-compose.yml up -d
# Local: browse http://localhost (NAVFLOW_HTTP_PORT overrides the host port).
# Real demo: set NAVFLOW_DOMAIN=demo.navflow.dev for automatic HTTPS, point its DNS A record here.
name: navflow-demo

services:
  navflowd:
    image: ${NAVFLOW_REGISTRY:-ghcr.io/glassflow/navflow}:${NAVFLOW_VERSION:-latest}
    command: ["navflow", "up", "--host", "0.0.0.0", "--data-dir", "/data"]
    environment:
      NAVFLOW_READONLY: "1"               # control plane (UI/MCP authoring) refused; ingest stays open
      NAVFLOW_CATALOG: /seed/catalog.yaml # the operator's source config (real services)
      NAVFLOW_CATALOG_SYNC: "1"           # re-import the catalog every boot: edit + restart to manage
      # NAVFLOW_INGEST_TOKEN: "change-me" # require this token on /ingest/* and /v1/* (set it on drains)
    volumes:
      - navflow-data:/data
      - ../demo/catalog.yaml:/seed/catalog.yaml:ro
      # docker_logs from inside the container needs the socket (and the docker CLI in the image):
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    expose: ["8787"]
    restart: unless-stopped

  mcp:
    image: ${NAVFLOW_REGISTRY:-ghcr.io/glassflow/navflow}:${NAVFLOW_VERSION:-latest}
    command: ["navflow", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0",
              "--port", "8788", "--navflowd", "http://navflowd:8787"]
    environment:
      NAVFLOW_READONLY: "1"
    expose: ["8788"]
    depends_on: [navflowd]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "${NAVFLOW_HTTP_PORT:-80}:80"
      - "${NAVFLOW_HTTPS_PORT:-443}:443"
    environment:
      # a real domain enables automatic HTTPS; unset falls back to plain HTTP on :80
      NAVFLOW_DOMAIN: "${NAVFLOW_DOMAIN:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [navflowd, mcp]
    restart: unless-stopped

volumes:
  navflow-data:
  caddy-data:
  caddy-config:
