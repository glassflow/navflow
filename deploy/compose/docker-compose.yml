# Tares single-host deploy — one hostname (Caddy) fronting the daemon + remote MCP.
# Pulls the prebuilt image (TARES_REGISTRY / TARES_VERSION override it; build locally with the
# docker-compose.build.yml override). Tracks :latest.
#   docker compose -f deploy/compose/docker-compose.yml up -d
# Local: browse http://localhost (TARES_HTTP_PORT overrides the host port).
# With a domain: set TARES_DOMAIN=tares.example.com for automatic HTTPS, point its DNS A record here.
# This runs OPEN (no auth). To require a login + scoped keys, add `--auth` to the tares up command
# (or set TARES_AUTH_TOKEN) — see docker-compose.selfhost.yml for the secured single-tenant setup.
name: tares-host

services:
  taresd:
    image: ${TARES_REGISTRY:-ghcr.io/glassflow/tares}:${TARES_VERSION:-latest}
    command: ["tares", "up", "--host", "0.0.0.0", "--data-dir", "/data"]
    environment:
      TARES_CATALOG: /seed/catalog.yaml # the operator's source config (real services)
      TARES_CATALOG_SYNC: "1"           # re-import the catalog every boot: edit + restart to manage
    volumes:
      - tares-data:/data
      - ../demo/catalog.yaml:/seed/catalog.yaml:ro
      # docker_logs from inside the container needs the socket (and the docker CLI in the image):
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    expose: ["8787"]
    restart: unless-stopped

  mcp:
    image: ${TARES_REGISTRY:-ghcr.io/glassflow/tares}:${TARES_VERSION:-latest}
    command: ["tares", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0",
              "--port", "8788", "--taresd", "http://taresd:8787"]
    expose: ["8788"]
    depends_on: [taresd]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "${TARES_HTTP_PORT:-80}:80"
      - "${TARES_HTTPS_PORT:-443}:443"
    environment:
      # a real domain enables automatic HTTPS; unset falls back to plain HTTP on :80
      TARES_DOMAIN: "${TARES_DOMAIN:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [taresd, mcp]
    restart: unless-stopped

volumes:
  tares-data:
  caddy-data:
  caddy-config:
