# Tares self-hosted single-tenant (Scenario 3) — a writable instance for one team, behind a token.
# Pulls the latest released image (:latest) — CI publishes only on release tags, so :latest tracks
# the newest release. Pin a specific one with TARES_VERSION=0.1.4 for reproducible deploys;
# TARES_REGISTRY points at another registry. Build locally with the build override.
#   TARES_AUTH_TOKEN=$(openssl rand -hex 24) TARES_DOMAIN=tares.acme.com \
#     docker compose -f deploy/compose/docker-compose.selfhost.yml up -d
#
# The console + MCP + ingest all require TARES_AUTH_TOKEN (humans log in with it; agents send it as
# a bearer token). Give producers their own scoped ingest API keys from the console (Security → API
# keys) rather than the root token. DuckDB is single-writer, so this is exactly ONE taresd + one
# volume — do not scale to replicas.
name: tares

services:
  taresd:
    image: ${TARES_REGISTRY:-ghcr.io/glassflow/tares}:${TARES_VERSION:-latest}
    command: ["tares", "up", "--host", "0.0.0.0", "--data-dir", "/data"]
    environment:
      TARES_AUTH_TOKEN: "${TARES_AUTH_TOKEN:?set TARES_AUTH_TOKEN (e.g. openssl rand -hex 24)}"
    volumes:
      - tares-data:/data                              # back this up: it holds tares.duckdb
    expose: ["8787"]
    restart: unless-stopped

  mcp:
    image: ${TARES_REGISTRY:-ghcr.io/glassflow/tares}:${TARES_VERSION:-latest}
    command: ["tares", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0",
              "--port", "8788", "--taresd", "http://taresd:8787"]
    environment:
      TARES_AUTH_TOKEN: "${TARES_AUTH_TOKEN:?set TARES_AUTH_TOKEN}"
    expose: ["8788"]
    depends_on: [taresd]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "${TARES_HTTP_PORT:-80}:80"
      - "${TARES_HTTPS_PORT:-443}:443"
    environment:
      TARES_DOMAIN: "${TARES_DOMAIN:-:80}"   # a real domain enables automatic HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [taresd, mcp]
    restart: unless-stopped

volumes:
  tares-data:
  caddy-data:
  caddy-config:
