# NavFlow MVP catalog — wired to the navflow-cookbooks platform (Prometheus :9090, api-server :8080).
# Copy to catalog.yaml and adjust the logs `compose_file` path to your checkout.
#
# `type` is no longer authored — it's derived from the connector. Sources can declare `labels`:
# named correlation axes events carry, each `const` (fixed) or `field` (extracted per event).
# Query/trigger per any label and browse them on the Entities page. `key_value` is the primary key.

sources:
  - name: metrics
    connector: prometheus
    poll: 5s
    config:
      url: http://localhost:9090
      default_key: api-server
      # Extra entity axis: tag each series with its `service` label, so you can also slice
      # metrics by service (the Entities page faceted by `service`) — additive to key=api-server.
      labels:
        - name: service
          field: service        # read from each Prometheus series' `service` label
      queries:
        # keyed to the api-server entity (default_key); the per-service breakdown rides in the text,
        # so deploys/config/logs/metrics all share key=api-server and correlate in one timeline.
        - promql: 'sum(rate(http_requests_total{status=~"5.."}[1m])) by (service)'
          event_type: 5xx_rate
          field: rate_5xx
          text: "5xx rate {service}={val}/s"
        - promql: 'histogram_quantile(0.99, sum(rate(http_request_duration_milliseconds_bucket[2m])) by (le, service))'
          event_type: p99
          field: p99_ms
          text: "p99 {service}={val}ms"
        - promql: 'db_pool_size'
          event_type: db_pool
          field: db_pool_size
          text: "db_pool_size={val}"
        - promql: 'db_connections_active'
          event_type: db_active
          field: db_connections_active
          text: "db_connections_active={val}"

  - name: deploys
    connector: changelog
    poll: 5s
    config:
      url: http://localhost:8080/admin/changelog
      key: api-server

  - name: config
    connector: config
    poll: 10s
    config:
      url: http://localhost:8080/admin/config
      key: api-server

  - name: logs
    connector: docker_logs
    poll: 5s
    config:
      container: api-server
      compose_file: ../navflow-cookbooks/platform/docker-compose.yml
      key: api-server

  - name: alerts
    connector: alerts
    poll: 5s
    config:
      url: http://localhost:9090
      key: api-server
      threshold: 5
      ratio_promql: '100*sum(rate(http_requests_total{status=~"5.."}[1m]))/sum(rate(http_requests_total[1m]))'

views:
  - name: service_timeline
    key_field: service
    sources: [deploys, config, logs, metrics, alerts]

triggers:
  # Error-storm detector — fires on an actual 5xx spike (error_spike, dependency_outage).
  # Stays quiet for timeout-shaped incidents (db_pool, latency), whose raw 5xx stays low.
  - name: error_spike
    view: service_timeline
    condition:
      aggregate: max        # max(rate_5xx) over the window, per key
      field: rate_5xx
      predicate: "> 1.0"
      window: 1m
      group_by: [key_value]
    emit:
      kind: error_spike
      attach_view: true
    cooldown: 5m

  # Latency detector — the right signal for pool exhaustion / latency regressions, whose
  # symptom is p99 blowing past the request timeout rather than a 5xx storm.
  - name: slow_responses
    view: service_timeline
    condition:
      aggregate: max        # max(p99_ms) over the window, per key
      field: p99_ms
      predicate: "> 1000"
      window: 1m
      group_by: [key_value]
    emit:
      kind: slow_responses
      attach_view: true
      context_window: 15m   # attach 15m of timeline (incl. the deploy), not just the 1m detection window
    cooldown: 30s
